name: clarity-os
description: ClarityOS - Universal Blue with Fedora COSMIC Desktop
base-image: ghcr.io/ublue-os/base-main
image-version: gts
modules:
  - type: rpm-ostree
    repos:
      - https://download.fedoraproject.org/pub/fedora/linux/releases/43/Everything/x86_64/os/
    install:
      # Explicit list instead of wildcard
      - cosmic-app-library
      - cosmic-applets
      - cosmic-bg
      - cosmic-comp
      - cosmic-edit
      - cosmic-files
      - cosmic-greeter
      - cosmic-icon-theme
      - cosmic-idle
      - cosmic-initial-setup
      - cosmic-launcher
      - cosmic-notifications
      - cosmic-osd
      - cosmic-panel
      - cosmic-player
      - cosmic-randr
      - cosmic-screenshot
      - cosmic-session
      - cosmic-settings
      - cosmic-settings-daemon
      - cosmic-store
      - cosmic-term
      - cosmic-wallpapers
      - cosmic-workspaces
      - micro
      - htop
      - vim
      - neovim
      - git
      - tmux
      - nano
  
  - type: default-flatpaks@v1
    notify: true
    system:
      install:
        - io.github.kolunmi.Bazaar
        - dev.edfloreshz.CosmicTweaks
        - io.github.flattool.Warehouse
        - com.github.tchx84.Flatseal
        - org.libreoffice.LibreOffice
        - io.github.celluloid_player.Celluloid
        - io.github.pixeldoted.cosmic-ext-color-picker
        - org.gnome.Loupe
        - org.gnome.Papers
        - org.gnome.baobab
        - org.gnome.FileRoller
        - com.francescogaglione.cosmicmoney
  
  - type: files
    files:
      - source: usr/etc/os-release
        destination: /etc/os-release
      - source: etc/hostname
        destination: /etc/hostname
      - source: etc/default/grub
        destination: /etc/default/grub
      - source: usr/share/backgrounds/default.jxl
        destination: /usr/share/backgrounds/default.jxl
      - source: usr/share/backgrounds/default-dark.jxl
        destination: /usr/share/backgrounds/default-dark.jxl
      - source: usr/share/plymouth/themes/spinner/watermark.png
        destination: /usr/share/plymouth/themes/spinner/watermark.png
