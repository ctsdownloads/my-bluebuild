name: clarityos
description: ClarityOS - Custom Fedora Atomic with COSMIC Desktop
base-image: ghcr.io/fedoraproject/fedora-cosmic-atomic
image-version: 42

modules:
  - type: rpm-ostree
    install:
      - micro
      - htop
      - vim
      - neovim
      - git
      - tmux
  
  - type: default-flatpaks
    notify: true
    system:
      install:
        - io.github.kolunmi.Bazaar
        - io.github.flattool.Warehouse
        - com.github.tchx84.Flatseal
        - org.libreoffice.LibreOffice
        - io.github.celluloid_player.Celluloid
        - org.gnome.Loupe
        - org.gnome.Papers
        - org.gnome.baobab
        - org.gnome.FileRoller
