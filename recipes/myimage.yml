name: clarityos
description: ClarityOS - Custom Fedora Atomic with COSMIC Desktop

base-image: quay.io/fedora-ostree-desktops/cosmic-atomic
image-version: 42

modules:
  - type: rpm-ostree
    install:
      - micro
      - htop
      - vim
      - neovim
      - git
      - tmux
  
  - type: default-flatpaks
    notify: true
    system:
      install:
        - io.github.kolunmi.Bazaar
        - io.github.flattool.Warehouse
        - com.github.tchx84.Flatseal
        - org.libreoffice.LibreOffice
        - io.github.celluloid_player.Celluloid
        - org.gnome.Loupe
        - org.gnome.Papers
        - org.gnome.baobab
        - org.gnome.FileRoller
      remove:
        - cosmic-store

  - type: script
    scripts:
      - pin-bazaar-to-dock.sh

scripts:
  pin-bazaar-to-dock.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    
    # Create COSMIC config directory structure
    COSMIC_CONFIG_DIR="/etc/skel/.config/com.system76.CosmicPanel"
    mkdir -p "$COSMIC_CONFIG_DIR"
    
    # Pin Bazaar to the COSMIC dock by default
    cat > "$COSMIC_CONFIG_DIR/dock_v1.ron" << 'DOCK_CONFIG'
    CosmicPanelConfig(
        name: "Dock",
        anchor: Bottom,
        layer: Top,
        keyboard_interactivity: None,
        size: CosmicPanelSize(
            width: 0,
            height: 48,
        ),
        output: "all",
        background: Opaque(Srgba(
            red: 0.0,
            green: 0.0,
            blue: 0.0,
            alpha: 0.9,
        )),
        plugins_wings: None,
        plugins_center: Some([
            (
                "cosmic-dock",
                {
                    "favorites": [
                        "io.github.kolunmi.Bazaar",
                        "org.mozilla.firefox",
                        "cosmic-files",
                        "cosmic-term",
                        "cosmic-edit",
                    ],
                },
            ),
        ]),
        expand_to_edges: false,
        padding: 4,
        spacing: 4,
    )
    DOCK_CONFIG
    
    chmod 644 "$COSMIC_CONFIG_DIR/dock_v1.ron"
    echo "✓ Bazaar pinned to COSMIC dock by default"
